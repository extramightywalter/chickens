<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chicken Race</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a2e; display: flex; align-items: center; justify-content: center; }
  canvas { background: #16213e; box-shadow: 0 0 30px rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const WALL = 20;           // wall thickness
const PLAYER_R = 16;       // player radius
const SPEED = 240;         // px per second

const CX = W / 2, CY = H / 2;
const OUTER_R = 270;       // track outer wall radius
const INNER_R = 150;       // track inner wall radius
const LAPS_TO_WIN = 3;

// Lobby button pad
const BUTTON = { x: CX + 120, y: CY, r: 28 };
const LOBBY_SPAWN = { x: CX - 60, y: CY };
const TRACK_SPAWN = { x: CX + (OUTER_R + INNER_R) / 2, y: CY };

const keys = {};
addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
addEventListener("keyup",   e => { keys[e.key.toLowerCase()] = false; });

const state = {
  scene: "lobby",          // "lobby" | "track" | "victory"
  px: LOBBY_SPAWN.x,
  py: LOBBY_SPAWN.y,
  angle: 0,                // last angular position on track
  accum: 0,                // accumulated angle (radians); 2π == 1 lap
  victoryTimer: 0,
};

function nearButton() {
  return Math.hypot(state.px - BUTTON.x, state.py - BUTTON.y) < BUTTON.r + PLAYER_R + 14;
}

function enterTrack() {
  state.scene = "track";
  state.px = TRACK_SPAWN.x;
  state.py = TRACK_SPAWN.y;
  state.angle = Math.atan2(state.py - CY, state.px - CX);
  state.accum = 0;
}

function backToLobby() {
  state.scene = "lobby";
  state.px = LOBBY_SPAWN.x;
  state.py = LOBBY_SPAWN.y;
  state.accum = 0;
}

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "e" && state.scene === "lobby" && nearButton()) enterTrack();
});

function move(dt) {
  let dx = 0, dy = 0;
  if (keys["w"]) dy -= 1; // forward
  if (keys["s"]) dy += 1; // backward
  if (keys["a"]) dx -= 1; // left
  if (keys["d"]) dx += 1; // right
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    state.px += (dx / len) * SPEED * dt;
    state.py += (dy / len) * SPEED * dt;
  }
}

function clampLobbyWalls() {
  state.px = Math.min(Math.max(state.px, WALL + PLAYER_R), W - WALL - PLAYER_R);
  state.py = Math.min(Math.max(state.py, WALL + PLAYER_R), H - WALL - PLAYER_R);
}

function clampTrackWalls() {
  // Keep the player inside the ring between inner and outer walls.
  let dx = state.px - CX, dy = state.py - CY;
  let d = Math.hypot(dx, dy) || 0.0001;
  const minD = INNER_R + PLAYER_R, maxD = OUTER_R - PLAYER_R;
  if (d < minD || d > maxD) {
    const c = Math.min(Math.max(d, minD), maxD) / d;
    state.px = CX + dx * c;
    state.py = CY + dy * c;
  }
}

function updateLaps() {
  const a = Math.atan2(state.py - CY, state.px - CX);
  let delta = a - state.angle;
  if (delta > Math.PI) delta -= 2 * Math.PI;
  if (delta < -Math.PI) delta += 2 * Math.PI;
  state.accum += delta;
  state.angle = a;
  if (Math.abs(state.accum) >= LAPS_TO_WIN * 2 * Math.PI) {
    state.scene = "victory";
    state.victoryTimer = 2.5;
  }
}

function update(dt) {
  if (state.scene === "lobby") {
    move(dt);
    clampLobbyWalls();
  } else if (state.scene === "track") {
    move(dt);
    clampTrackWalls();
    updateLaps();
  } else if (state.scene === "victory") {
    state.victoryTimer -= dt;
    if (state.victoryTimer <= 0) backToLobby();
  }
}

// ---------- drawing ----------

function drawWallsRect() {
  ctx.fillStyle = "#533483";
  ctx.fillRect(0, 0, W, WALL);
  ctx.fillRect(0, H - WALL, W, WALL);
  ctx.fillRect(0, 0, WALL, H);
  ctx.fillRect(W - WALL, 0, WALL, H);
}

function drawPlayer() {
  ctx.beginPath();
  ctx.arc(state.px, state.py, PLAYER_R, 0, Math.PI * 2);
  ctx.fillStyle = "#f9ed69";
  ctx.fill();
  ctx.strokeStyle = "#b08968";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.font = "22px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🐔", state.px, state.py + 1);
}

function drawLobby() {
  ctx.fillStyle = "#16213e";
  ctx.fillRect(0, 0, W, H);
  drawWallsRect();

  // Button pad
  ctx.beginPath();
  ctx.arc(BUTTON.x, BUTTON.y, BUTTON.r + 8, 0, Math.PI * 2);
  ctx.fillStyle = "#394867";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(BUTTON.x, BUTTON.y, BUTTON.r, 0, Math.PI * 2);
  ctx.fillStyle = nearButton() ? "#ff4757" : "#c0392b";
  ctx.fill();

  ctx.fillStyle = "#e0e0e0";
  ctx.font = "18px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Move with W A S D", CX, 70);
  if (nearButton()) {
    ctx.fillStyle = "#f9ed69";
    ctx.font = "bold 22px sans-serif";
    ctx.fillText("Press E to race!", BUTTON.x, BUTTON.y - BUTTON.r - 24);
  }
  drawPlayer();
}

function drawTrack() {
  ctx.fillStyle = "#0f3460";
  ctx.fillRect(0, 0, W, H);

  // Road
  ctx.beginPath();
  ctx.arc(CX, CY, OUTER_R, 0, Math.PI * 2);
  ctx.fillStyle = "#3d3d3d";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(CX, CY, INNER_R, 0, Math.PI * 2);
  ctx.fillStyle = "#2e8b57";
  ctx.fill();

  // Walls
  ctx.lineWidth = 8;
  ctx.strokeStyle = "#e94560";
  ctx.beginPath();
  ctx.arc(CX, CY, OUTER_R + 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(CX, CY, INNER_R - 4, 0, Math.PI * 2);
  ctx.stroke();

  // Start/finish line
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 6;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.moveTo(CX + INNER_R, CY);
  ctx.lineTo(CX + OUTER_R, CY);
  ctx.stroke();
  ctx.setLineDash([]);

  // HUD
  const lap = Math.min(Math.floor(Math.abs(state.accum) / (2 * Math.PI)) + 1, LAPS_TO_WIN);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 26px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(`Lap ${lap} / ${LAPS_TO_WIN}`, CX, 40);

  drawPlayer();
}

function drawVictory() {
  drawTrack();
  ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#f9ed69";
  ctx.font = "bold 80px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("VICTORY", CX, CY);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  if (state.scene === "lobby") drawLobby();
  else if (state.scene === "track") drawTrack();
  else drawVictory();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
