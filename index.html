<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chicken Race 3D</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="hud"></div>
<div id="rival-indicator" aria-hidden="true">
  <span class="arrow"></span>
  <svg class="avatar" viewBox="0 0 64 64">
    <path d="M22 14c-2-7 1-10 5-6l4 4c3-7 7-7 8-1l1 4c8 2 13 9 13 18v12H15V31c0-8 3-14 7-17Z" fill="#e53935"/>
    <path d="M15 30 5 38l10 5m38-13 6 8-6 5" fill="#a71919" stroke="#a71919" stroke-width="4" stroke-linejoin="round"/>
    <path d="M48 22h10l-8 6" fill="#ffb02e"/>
    <circle cx="27" cy="21" r="2" fill="#fff"/><circle cx="41" cy="21" r="2" fill="#fff"/>
    <path d="M25 47v9m18-9v9m-18 0-5 3m23-3 5 3" fill="none" stroke="#e9a23b" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <span class="label">RIVAL</span>
</div>
<div id="countdown" role="status" aria-live="polite"></div>
<div id="msg"><span id="result">VICTORY</span><small>Press Enter to return to the button</small></div>
<div id="game-menu" class="menu-overlay" hidden>
  <section class="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <h1 id="menu-title">Choose a minigame</h1>
    <div id="menu-options" class="menu-options">
      <button id="random-minigame" type="button">Random</button>
      <button id="choose-minigame" type="button">Choose minigame</button>
    </div>
    <div id="minigame-options" class="menu-options" hidden>
      <button type="button" data-minigame="track">Race</button>
      <button type="button" data-minigame="pillows">Pillow Dodge</button>
      <button type="button" data-minigame="doors">Door Dash</button>
      <button id="back-to-menu" type="button">Back</button>
    </div>
    <button id="close-menu" class="menu-cancel" type="button">Cancel</button>
  </section>
</div>
<div id="lan-menu" class="menu-overlay" hidden>
  <section class="menu-panel" role="dialog" aria-modal="true" aria-labelledby="lan-title">
    <h1 id="lan-title">LAN games</h1>
    <p id="lan-status" role="status" aria-live="polite"></p>
    <div id="lan-options" class="menu-options">
      <button id="lan-host" type="button">Host a game</button>
      <button id="lan-play" type="button">Play a game</button>
    </div>
    <form id="lan-settings" class="menu-options" hidden>
      <label for="lan-selection">Minigame</label>
      <select id="lan-selection" name="selection"></select>
      <label for="lan-slots">Slots (including you)</label>
      <select id="lan-slots" name="slots">
        <option>2</option><option>3</option><option>4</option><option>5</option>
        <option>6</option><option>7</option><option>8</option>
      </select>
      <button type="submit">Create game</button>
    </form>
    <div id="lan-games" class="menu-options" hidden></div>
    <div id="lan-waiting" hidden>
      <p>The game starts automatically when every slot is full.</p>
      <ol id="lan-members"></ol>
    </div>
    <button id="lan-back" class="menu-cancel" type="button" hidden>Back</button>
    <button id="lan-close" class="menu-cancel" type="button">Cancel</button>
  </section>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
